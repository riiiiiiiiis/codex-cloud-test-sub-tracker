<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SubTrack Cloud</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/assets/translations.js" defer></script>
    <script type="module" src="/js/landing.js" defer></script>
  </head>
  <body class="light-theme">
    <header class="site-header">
      <div class="container nav-container">
        <div class="logo">SubTrack Cloud</div>
        <button class="burger" id="burger" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav id="nav-items">
          <a href="#features" data-scroll-to="#features" data-i18n="landing.navFeatures"></a>
          <a href="#analytics" data-scroll-to="#analytics" data-i18n="landing.navAnalytics"></a>
          <a href="#about" data-scroll-to="#about" data-i18n="landing.navHow"></a>
          <a href="#faq" data-scroll-to="#faq" data-i18n="landing.navFaq"></a>
          <a href="#" id="nav-login" data-i18n="landing.navLogin"></a>
          <div class="language-switcher">
            <button type="button" data-language="ru">RU</button>
            <button type="button" data-language="en">EN</button>
          </div>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" id="hero">
        <div class="container hero-layout">
          <div class="hero-text">
            <div class="hero-badge">
              <span class="pulse"></span>
              <span data-i18n="landing.heroBadge"></span>
            </div>
            <h1 data-i18n="landing.heroTitle"></h1>
            <p class="lead" data-i18n="landing.heroSubtitle"></p>
            <div class="hero-meta">
              <div class="meta-card">
                <strong>98%</strong>
                <span data-i18n="landing.heroMetaRetention"></span>
              </div>
              <div class="meta-card">
                <strong>5</strong>
                <span data-i18n="landing.heroMetaMinutes"></span>
              </div>
              <div class="meta-card">
                <strong>24/7</strong>
                <span data-i18n="landing.heroMetaSync"></span>
              </div>
            </div>
            <div class="actions">
              <button class="btn primary" id="hero-primary" data-i18n="landing.heroPrimary"></button>
              <button class="btn ghost" id="hero-secondary" data-i18n="landing.heroSecondary"></button>
            </div>
            <p class="hero-footnote" data-i18n="landing.heroFootnote"></p>
          </div>
          <div class="hero-visual">
            <div class="hero-visual-pill">
              <span class="pulse"></span>
              <span data-i18n="landing.heroVisualTitle"></span>
            </div>
            <div class="hero-visual-summary">
              <div class="summary-card">
                <span data-i18n="landing.heroVisualMonthly"></span>
                <strong>$482</strong>
              </div>
              <div class="summary-card accent">
                <span data-i18n="landing.heroVisualSaved"></span>
                <strong>+18%</strong>
              </div>
            </div>
            <div class="hero-visual-list">
              <article class="hero-visual-item">
                <div class="item-main">
                  <span class="hero-visual-name">Netflix</span>
                  <span class="badge" data-i18n="categories.entertainment"></span>
                </div>
                <span class="hero-visual-date" data-i18n="landing.heroVisualTomorrow"></span>
                <span class="hero-visual-amount">$15.99</span>
              </article>
              <article class="hero-visual-item">
                <div class="item-main">
                  <span class="hero-visual-name">Spotify</span>
                  <span class="badge" data-i18n="categories.entertainment"></span>
                </div>
                <span class="hero-visual-date" data-i18n="landing.heroVisualInTwo"></span>
                <span class="hero-visual-amount">$9.99</span>
              </article>
              <article class="hero-visual-item">
                <div class="item-main">
                  <span class="hero-visual-name">Adobe CC</span>
                  <span class="badge" data-i18n="categories.software"></span>
                </div>
                <span class="hero-visual-date" data-i18n="landing.heroVisualNextWeek"></span>
                <span class="hero-visual-amount">$54.99</span>
              </article>
            </div>
          </div>
        </div>
      </section>

      <section id="features" class="section">
        <div class="container">
          <h2 data-i18n="landing.featuresTitle"></h2>
          <div class="feature-grid" id="feature-grid"></div>
        </div>
      </section>

      <section id="analytics" class="section muted">
        <div class="container">
          <h2 data-i18n="landing.analyticsTitle"></h2>
          <div class="tabs">
            <button class="tab active" data-analytics-tab="overview" data-i18n="landing.analyticsTabs.overview"></button>
            <button class="tab" data-analytics-tab="upcoming" data-i18n="landing.analyticsTabs.upcoming"></button>
          </div>
          <div class="analytics-panels">
            <div id="analytics-overview" class="analytics-grid"></div>
            <div id="analytics-upcoming" class="upcoming-list hidden"></div>
          </div>
        </div>
      </section>

      <section id="about" class="section">
        <div class="container two-columns">
          <div>
            <h2 data-i18n="landing.aboutTitle"></h2>
            <ol class="steps" id="steps"></ol>
          </div>
          <div class="security">
            <h3 data-i18n="landing.securityTitle"></h3>
            <ul id="security-points"></ul>
          </div>
        </div>
      </section>

      <section class="section callout">
        <div class="container">
          <h2 data-i18n="landing.ctaTitle"></h2>
          <button class="btn primary" data-i18n="landing.ctaButton" onclick="window.location.href='/login.html'"></button>
        </div>
      </section>

      <section id="faq" class="section muted">
        <div class="container">
          <h2 data-i18n="landing.faqTitle"></h2>
          <div class="faq-list" id="faq-list"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p data-i18n="landing.footerNote"></p>
        <a href="https://github.com" target="_blank" rel="noopener" data-i18n="landing.footerRepo"></a>
      </div>
    </footer>
  </body>
</html>
